name: Release oto TUI

on:
  push:
    tags:
      - "tui-v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install ALSA dependencies (for Linux build)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config gcc-mingw-w64-x86-64

      - name: Generate embedded TUI changelog
        run: bash scripts/generate-tui-changelog.sh "${GITHUB_REF_NAME}"

      - name: Build Linux amd64
        run: |
          GOOS=linux GOARCH=amd64 go build \
            -ldflags "-X main.Version=${{ github.ref_name }}" \
            -o oto-linux-amd64 ./cmd/oto

      - name: Build Windows amd64
        run: |
          CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc GOOS=windows GOARCH=amd64 go build \
            -ldflags "-X main.Version=${{ github.ref_name }}" \
            -o oto-windows-amd64.exe ./cmd/oto

      - name: Sign release binaries (minisign)
        env:
          oto_MINISIGN_KEY: ${{ secrets.SOM_MINISIGN_KEY }}
        run: |
          go run ./cmd/oto-sign sign oto-linux-amd64 oto-windows-amd64.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            oto-linux-amd64
            oto-linux-amd64.minisig
            oto-windows-amd64.exe
            oto-windows-amd64.exe.minisig
          generate_release_notes: true

      - name: Delete tag on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh tag -d "$TAG" || true
          git push origin --delete "$TAG" || true