name: Deploy oto Backend to GCP

on:
  push:
    branches:
      - main
    paths:
      - 'cmd/server/**'
      - 'internal/handler/**'
      - 'internal/scraper/**'
      - 'internal/cache/**'
      - 'internal/backend/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'Caddyfile'
      - '.github/workflows/deploy.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 

      - name: Set up Go
        uses: actions/setup-go@v5 
        with:
          go-version: '1.26' 

      - name: Install ALSA Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Run Backend Unit Tests
        run: go test -v ./cmd/server ./internal/handler ./internal/scraper ./internal/cache ./internal/backend ./internal/local ./internal/domain

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/oto-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GCP
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -Eeuo pipefail

            APP_DIR="$HOME/oto"

            # Migrate old directory if needed
            if [[ ! -d "$APP_DIR/.git" ]]; then
              if [[ -d "$HOME/SOM/.git" && ! -e "$APP_DIR" ]]; then
                mv "$HOME/SOM" "$APP_DIR"
              elif [[ ! -e "$APP_DIR" ]]; then
                git clone https://github.com/GianT404/oto.git "$APP_DIR"
              else
                echo "Invalid application directory: $APP_DIR"
                exit 1
              fi
            fi

            cd "$APP_DIR"

            # Update repository remote
            git remote set-url origin https://github.com/GianT404/oto.git

            # Pull latest source code
            git fetch origin main
            git reset --hard origin/main

            # Keep server-managed .env unchanged
            if [[ ! -s .env ]]; then
              echo "Missing or empty .env file"
              exit 1
            fi

            # Validate required backend API key without displaying its value
            if ! grep -Eq '^oto_API_KEY=.+$' .env; then
              echo "Missing or empty oto_API_KEY in .env"
              exit 1
            fi

            # Validate Docker Compose configuration
            docker compose config -q

            # Pull latest images and deploy
            docker compose pull
            docker compose up -d --remove-orphans

            echo "OTO deployment completed."